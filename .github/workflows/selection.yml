name: 收盘选股

on:
  workflow_dispatch:
  # 兜底：外部定时器失效时，工作日 15:40（北京时间）自己跑一次
  # schedule:
  #   - cron: '40 7 * * 1-5'

# runner 默认 UTC。不设 TZ 的话，代码里的 datetime.now() 会比北京时间慢 8 小时，
# 曾经因此把 17:30 误判成"还没收盘"，导致数据更新天天被跳过。
env:
  TZ: Asia/Shanghai

jobs:
  run-selection:
    runs-on: ubuntu-latest
    # 必须大于下面选股步骤的 timeout（90)，否则步骤级放宽会被 job 级先掐掉。
    # 选股步骤 90 + 依赖安装/缓存恢复/缓存保存约 5 分钟，留 15 分钟余量。
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Restore database cache
        uses: actions/cache@v4
        with:
          path: data
          key: stock-db-${{ github.run_id }}
          restore-keys: stock-db-
      - name: Check database
        id: check-db
        run: |
          if [ -f "data/stock_selection.db" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - name: Initialize data (first run)
        if: steps.check-db.outputs.exists == 'false'
        run: python main.py init
        timeout-minutes: 45
      - name: Run selection and push
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python main.py run --security-keyword "A股"
        # 2026-10-26 运行 #16 失败根因：主数据源当日K线未就绪，被迫全量降级腾讯财经，
        # 该模式实测约 88 秒/100 只，5401 只需 54 批 ≈ 79 分钟，50 分钟预算必然打满超时。
        # 本仓库为 public，Actions 分钟数不计量，放宽到 90 分钟零成本。
        timeout-minutes: 90
