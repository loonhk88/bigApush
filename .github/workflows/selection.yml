name: 收盘选股

on:
  workflow_dispatch:
  # 兜底：外部定时器失效时，工作日 15:40（北京时间）自己跑一次
  # schedule:
  #   - cron: '40 7 * * 1-5'

# runner 默认 UTC。不设 TZ 的话，代码里的 datetime.now() 会比北京时间慢 8 小时，
# 曾经因此把 17:30 误判成"还没收盘"，导致数据更新天天被跳过。
env:
  TZ: Asia/Shanghai

jobs:
  run-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Restore database cache
        uses: actions/cache@v4
        with:
          path: data
          key: stock-db-${{ github.run_id }}
          restore-keys: stock-db-
      - name: Check database
        id: check-db
        run: |
          if [ -f "data/stock_selection.db" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - name: Initialize data (first run)
        if: steps.check-db.outputs.exists == 'false'
        run: python main.py init
        timeout-minutes: 45
      - name: Run selection and push
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python main.py run --security-keyword "A股"
        timeout-minutes: 30
